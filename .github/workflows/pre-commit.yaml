name: pre-commit

on:
  workflow_dispatch:
  pull_request:
    # The default types plus ready_for_review: auto-merge.yaml acts when pre-commit ends, and skips a draft, so a pull request
    # that is marked ready needs a run of its own.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches-ignore:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      TF_CLI_ARGS: "-no-color"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files
